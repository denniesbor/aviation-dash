[project]
name = "space-weather-dash"
version = "0.1.0"
description = "Real-time space weather and aviation dashboard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "dotenv>=0.9.9",
    "httpx>=0.28.1",
    "pandas>=3.0.1",
    "prefect>=3.6.22",
    "psycopg2-binary>=2.9.11",
    "pyopensky>=2.16",
    "pyquery>=2.0.1",
    "pytz>=2025.2",
    "redis>=7.3.0",
    "requests>=2.32.5",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=7.2.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = ["ignore::UserWarning"]
log_cli = false
env = ["PREFECT_LOGGING_TO_API_WHEN_MISSING_FLOW=ignore"]
